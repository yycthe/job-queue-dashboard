<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Queue</title>
  <script src="./dashboard-local/privacy-mode.js"></script>
  <link rel="stylesheet" href="./dashboard-local/privacy-mode.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #191918;
      --muted: #76746f;
      --line: #e8e6e1;
      --paper: #fbfaf7;
      --card: #ffffff;
      --accent: #315b43;
      --soft: #edf3ee;
      --warning: #9a6418;
      --danger: #8d3c35;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
    h1 { margin: 0 0 6px; font-family: Georgia, serif; font-size: clamp(32px, 5vw, 48px); font-weight: 500; letter-spacing: -0.035em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
    .today { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .tabs { display: inline-flex; gap: 4px; padding: 4px; background: #efede8; border-radius: 10px; }
    .tab { border: 0; border-radius: 7px; padding: 9px 14px; color: var(--muted); background: transparent; font: inherit; font-size: 14px; cursor: pointer; }
    .tab.active { background: white; color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 8%); }
    .count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; margin-left: 5px; padding: 1px 6px; border-radius: 999px; background: #e6e4df; font-size: 11px; }
    .active .count { background: var(--soft); color: var(--accent); }
    input, select { width: 230px; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--card); color: var(--ink); font: inherit; font-size: 14px; outline: none; }
    select { width: auto; cursor: pointer; }
    input:focus, select:focus { border-color: #a8b9ad; box-shadow: 0 0 0 3px var(--soft); }
    .tools { display: flex; gap: 8px; }
    .list { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .row { display: grid; grid-template-columns: minmax(240px, 1.6fr) minmax(150px, .85fr) 142px 22px; align-items: center; gap: 20px; width: 100%; min-height: 82px; padding: 16px 18px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; text-align: left; cursor: pointer; }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: #fdfcf9; }
    .company { margin-bottom: 5px; font-size: 13px; color: var(--muted); }
    .role { font-size: 15px; font-weight: 650; line-height: 1.3; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .status { justify-self: start; padding: 6px 9px; border-radius: 999px; background: var(--soft); color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
    .status.needs-user { background: #fbf0dc; color: var(--warning); }
    .status.rejected, .status.withdrawn { background: #f5e9e7; color: var(--danger); }
    .status.preparing, .status.submitting { background: #edf0f5; color: #4b5f7a; }
    .arrow { color: #aaa7a0; font-size: 20px; }
    .empty { padding: 44px; text-align: center; color: var(--muted); }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 13px; }
    .pager button, .link-button { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: white; color: var(--ink); cursor: pointer; font: inherit; }
    .pager button:disabled { opacity: .45; cursor: default; }
    dialog { width: min(820px, calc(100% - 32px)); max-height: calc(100vh - 42px); border: 0; border-radius: 16px; padding: 0; box-shadow: 0 24px 80px rgb(0 0 0 / 20%); }
    dialog::backdrop { background: rgb(30 29 27 / 35%); backdrop-filter: blur(2px); }
    .detail { padding: 26px; }
    .detail-top { display: flex; justify-content: space-between; gap: 18px; }
    .detail h2 { margin: 4px 0 6px; font-family: Georgia, serif; font-size: 27px; font-weight: 500; }
    .detail-company { color: var(--accent); font-size: 13px; font-weight: 700; }
    .detail-actions { display: flex; align-items: center; gap: 4px; }
    .detail-nav, .close { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 24px; cursor: pointer; }
    .detail-nav:hover:not(:disabled), .close:hover { background: var(--paper); color: var(--ink); }
    .detail-nav:focus-visible, .close:focus-visible { outline: 2px solid #a8b9ad; outline-offset: 2px; }
    .detail-nav:disabled { opacity: .28; cursor: default; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 26px 0; }
    .label { margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .value { font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    .next, .blocker { padding: 16px; border-radius: 10px; background: var(--paper); }
    .blocker { margin-top: 14px; background: #fbf0dc; }
    .section { margin-top: 24px; }
    .section h3 { margin: 0 0 10px; font-family: Georgia, serif; font-size: 20px; font-weight: 500; }
    .section ul { margin: 0; padding-left: 20px; }
    .section li { margin: 6px 0; line-height: 1.5; }
    .document-card { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: white; }
    .document-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px; background: #fdfcf9; }
    .document-meta { min-width: 0; }
    .file-name { font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .file-path { margin-top: 3px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .info-card { margin-top: 10px; padding: 5px 16px; border: 1px solid var(--line); border-radius: 12px; background: white; }
    .info-title { margin: 16px 0 8px; color: var(--ink); font-family: Georgia, serif; font-size: 16px; }
    .info-row { display: grid; grid-template-columns: minmax(130px, .34fr) minmax(0, 1fr); gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .info-row:last-child { border-bottom: 0; }
    .info-key { color: var(--muted); font-size: 12px; font-weight: 650; line-height: 1.45; }
    .info-value { font-size: 13px; line-height: 1.58; overflow-wrap: anywhere; }
    .info-copy { margin: 11px 0; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
    .info-list { margin: 10px 0 12px; padding-left: 20px; }
    .info-list li { margin: 6px 0; font-size: 13px; line-height: 1.55; }
    .file-unavailable { padding: 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    a { color: var(--accent); }
    .loading { padding: 22px; color: var(--muted); }
    @media (max-width: 680px) {
      .shell { width: min(100% - 20px, 960px); padding-top: 28px; }
      header { align-items: flex-start; flex-direction: column; margin-bottom: 26px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .tabs { width: 100%; }
      .tab { flex: 1; }
      .tools { flex-direction: column; }
      input, select { width: 100%; }
      .row { grid-template-columns: 1fr auto; gap: 10px; }
      .row .meta { grid-column: 1; }
      .row .status { grid-column: 2; grid-row: 1 / span 2; }
      .arrow { display: none; }
      .detail-grid { grid-template-columns: 1fr; }
      .document-head { align-items: flex-start; flex-direction: column; }
      .info-row { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Job Queue</h1>
        <p class="subtitle" id="dashboardSubtitle">Prepare first. Review before submission.</p>
      </div>
      <div class="today" id="today"></div>
    </header>
    <section class="privacy-control" aria-label="Privacy Mode">
      <div>
        <div class="privacy-label">Privacy Mode</div>
        <p class="privacy-caption" id="privacyCaption">Hide counts only. Your real records and documents stay visible.</p>
      </div>
      <button class="privacy-switch" id="privacyModeToggle" type="button" role="switch" aria-checked="false" aria-describedby="privacyCaption" aria-label="Privacy Mode" disabled><span class="privacy-track" aria-hidden="true"></span><span id="privacyModeState">Loading…</span></button>
    </section>
    <div class="toolbar">
      <nav class="tabs" aria-label="Dashboard views">
        <button class="tab active" data-view="queue">Queue <span class="count" id="queueCount"></span></button>
        <button class="tab" data-view="applications">Applications <span class="count" id="applicationCount"></span></button>
      </nav>
      <div class="tools">
        <select id="statusFilter" aria-label="Filter applications by status" hidden>
          <option value="">All statuses</option>
        </select>
        <select id="sort" aria-label="Sort by time">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
        <input id="search" type="search" placeholder="Search company, role or status" aria-label="Search records">
      </div>
    </div>
    <section class="list" id="list" aria-live="polite"></section>
    <div class="pager" id="pager" hidden>
      <button id="previousPage">Previous</button>
      <span id="pageStatus"></span>
      <button id="nextPage">Next</button>
    </div>
  </main>
  <dialog id="detailDialog">
    <div class="detail">
      <div class="detail-top">
        <div>
          <div class="detail-company" id="detailCompany"></div>
          <h2 id="detailRole"></h2>
          <div class="meta" id="detailLocation"></div>
        </div>
        <div class="detail-actions">
          <button class="detail-nav" id="previousRecord" aria-label="Previous item" title="Previous item (Left arrow)">‹</button>
          <button class="detail-nav" id="nextRecord" aria-label="Next item" title="Next item (Right arrow)">›</button>
          <button class="close" id="closeDialog" aria-label="Close">×</button>
        </div>
      </div>
      <div id="detailBody" class="loading">Loading record…</div>
    </div>
  </dialog>
  <script>
    window.startJobDashboard = function () {
      "use strict";
      var privacyMode = window.JobDashboardPrivacy.enabled;
      var data = window.DASHBOARD_INDEX || { generatedAt: null, queue: [], applications: [] };
      var activeView = "queue";
      var page = 1;
      var pageSize = 25;
      var list = document.getElementById("list");
      var search = document.getElementById("search");
      var statusFilter = document.getElementById("statusFilter");
      var sort = document.getElementById("sort");
      var pager = document.getElementById("pager");
      var dialog = document.getElementById("detailDialog");
      var detailBody = document.getElementById("detailBody");
      var previousRecord = document.getElementById("previousRecord");
      var nextRecord = document.getElementById("nextRecord");
      var loadedScripts = Object.create(null);
      var currentItemId = null;

      document.getElementById("today").textContent = new Intl.DateTimeFormat("en-CA", {
        weekday: "long", month: "long", day: "numeric"
      }).format(new Date());
      function renderCounts() {
        ["queue", "applications"].forEach(function (view) {
          var count = document.getElementById(view === "queue" ? "queueCount" : "applicationCount");
          count.textContent = privacyMode ? "—" : data[view].length;
          count.setAttribute("aria-label", privacyMode ? "Count hidden" : String(data[view].length));
        });
        document.getElementById("privacyModeToggle").setAttribute("aria-checked", String(privacyMode));
        document.getElementById("privacyModeState").textContent = privacyMode ? "On" : "Off";
        // Replace native option text so the opened menu also contains no totals.
        var selectedStatus = statusFilter.value;
        var all = document.createElement("option");
        all.value = "";
        all.textContent = "All statuses";
        statusFilter.replaceChildren(all);
        var preferredOrder = ["INTERVIEW", "APPLIED_CONFIRMED", "REJECTED", "WITHDRAWN", "JOB_CLOSED", "NEEDS_USER", "SUBMITTING"];
        var counts = data.applications.reduce(function (result, item) {
          var status = item.status || "UNKNOWN";
          result[status] = (result[status] || 0) + 1;
          return result;
        }, Object.create(null));
        Object.keys(counts).sort(function (a, b) {
          var aIndex = preferredOrder.indexOf(a);
          var bIndex = preferredOrder.indexOf(b);
          if (aIndex === -1) aIndex = preferredOrder.length;
          if (bIndex === -1) bIndex = preferredOrder.length;
          return aIndex - bIndex || a.localeCompare(b);
        }).forEach(function (status) {
          var option = document.createElement("option");
          option.value = status;
          option.textContent = status.replace(/_/g, " ") + (privacyMode ? "" : " (" + counts[status] + ")");
          statusFilter.appendChild(option);
        });
        statusFilter.value = selectedStatus;
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char];
        });
      }

      function statusClass(status) {
        return String(status || "").toLowerCase().replace(/_/g, "-");
      }

      function formatTime(value) {
        if (!value) return "—";
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return new Intl.DateTimeFormat("en-CA", {
          month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit"
        }).format(date);
      }

      function filteredRows() {
        var query = search.value.trim().toLowerCase();
        var selectedStatus = activeView === "applications" ? statusFilter.value : "";
        var direction = sort.value === "newest" ? -1 : 1;
        return data[activeView].filter(function (item) {
          var matchesStatus = !selectedStatus || item.status === selectedStatus;
          var matchesSearch = [item.company, item.role, item.location, item.status, item.id].join(" ").toLowerCase().includes(query);
          return matchesStatus && matchesSearch;
        }).sort(function (a, b) {
          return (new Date(a.eventTime || 0) - new Date(b.eventTime || 0)) * direction;
        });
      }

      function render() {
        var rows = filteredRows();
        var pages = Math.max(1, Math.ceil(rows.length / pageSize));
        if (page > pages) page = pages;
        var start = (page - 1) * pageSize;
        var shown = rows.slice(start, start + pageSize);
        if (!shown.length) {
          list.innerHTML = '<div class="empty">' + (activeView === "queue"
            ? "No active preparation items. Confirmed submissions are in Applications."
            : "Nothing found.") + "</div>";
        } else {
          list.innerHTML = shown.map(function (item) {
            return '<button class="row" data-id="' + escapeHtml(item.id) + '">' +
              '<div><div class="company">' + escapeHtml(item.company) + '</div><div class="role">' + escapeHtml(item.role) + '</div></div>' +
              '<div class="meta">' + escapeHtml(item.location || "Location unavailable") + '<br>' +
              (activeView === "applications" ? "Event " : "Added ") + escapeHtml(formatTime(item.eventTime)) + '</div>' +
              '<span class="status ' + escapeHtml(statusClass(item.status)) + '">' + escapeHtml(item.status) + '</span>' +
              '<span class="arrow">›</span></button>';
          }).join("");
        }
        pager.hidden = rows.length <= pageSize;
        document.getElementById("pageStatus").textContent = "Page " + page + (privacyMode ? "" : " of " + pages + " · " + rows.length + " records");
        document.getElementById("previousPage").disabled = page <= 1;
        document.getElementById("nextPage").disabled = page >= pages;
      }

      function addField(label, value, html) {
        return '<div><div class="label">' + escapeHtml(label) + '</div><div class="value">' +
          (html ? value : escapeHtml(value == null || value === "" ? "—" : value)) + '</div></div>';
      }

      function listSection(title, values) {
        if (!values || !values.length) return "";
        return '<section class="section"><h3>' + escapeHtml(title) + '</h3><ul>' +
          values.map(function (value) { return "<li>" + escapeHtml(value) + "</li>"; }).join("") + "</ul></section>";
      }

      function safeWebHref(value) {
        try {
          var url = new URL(String(value));
          return /^(https?:)$/.test(url.protocol) && !url.username && !url.password ? url.href : "";
        } catch (_) { return ""; }
      }

      function localFileHref(value) {
        // Only project-relative PDF materials are linked. Text stays readable below.
        if (typeof value !== "string" || !/^\.\/(working-applications|application-archives)\//.test(value)) return "";
        var parts = value.slice(2).split("/");
        if (parts.some(function (part) { return !part || part === "." || part === ".." || /[\\\\%:#?\x00-\x1f]/.test(part); })) return "";
        if (!/\.pdf$/i.test(value)) return "";
        return "./" + parts.map(encodeURIComponent).join("/");
      }

      function documentSection(title, doc) {
        if (!doc) return "";
        var href = localFileHref(doc.localPath);
        var link = href ? '<a class="link-button" href="' + escapeHtml(href) +
          '" target="_blank" rel="noopener noreferrer">Open local original</a>' : "";
        var text = doc.text ? '<div class="info-card">' + structuredText(doc.text) + '</div>'
          : '<div class="file-unavailable">No material text recorded yet.</div>';
        return '<section class="section"><h3>' + escapeHtml(title) + '</h3><div class="document-card">' +
          '<div class="document-head"><div class="document-meta"><div class="file-name">' +
          escapeHtml(doc.fileName || title) + '</div></div>' + link + '</div>' + text + '</div></section>';
      }

      function cleanInline(value) {
        return String(value || "").replace(/\*\*/g, "").replace(/`/g, "").trim();
      }

      function structuredText(value) {
        var lines = String(value || "").split(/\r?\n/);
        var html = "";
        var listOpen = false;
        function closeList() {
          if (listOpen) { html += "</ul>"; listOpen = false; }
        }
        lines.forEach(function (raw) {
          var line = cleanInline(raw);
          if (!line) { closeList(); return; }
          if (/^#{1,4}\s+/.test(line)) {
            closeList();
            html += '<div class="info-title">' + escapeHtml(line.replace(/^#{1,4}\s+/, "")) + "</div>";
            return;
          }
          var bullet = line.match(/^[-•]\s+(.*)$/);
          if (bullet) {
            var body = bullet[1];
            var pair = body.match(/^([^:]{2,46}):\s*(.+)$/);
            if (pair) {
              closeList();
              html += '<div class="info-row"><div class="info-key">' + escapeHtml(pair[1]) +
                '</div><div class="info-value">' + escapeHtml(pair[2]) + "</div></div>";
            } else {
              if (!listOpen) { html += '<ul class="info-list">'; listOpen = true; }
              html += "<li>" + escapeHtml(body) + "</li>";
            }
            return;
          }
          var pair = line.match(/^([^:]{2,46}):\s*(.+)$/);
          if (pair && !/^https?:/i.test(line)) {
            closeList();
            html += '<div class="info-row"><div class="info-key">' + escapeHtml(pair[1]) +
              '</div><div class="info-value">' + escapeHtml(pair[2]) + "</div></div>";
          } else {
            closeList();
            html += '<p class="info-copy">' + escapeHtml(line) + "</p>";
          }
        });
        closeList();
        return html || '<p class="info-copy">No details recorded.</p>';
      }

      function infoSection(title, value) {
        if (!value) return "";
        return '<section class="section"><h3>' + escapeHtml(title) + '</h3><div class="info-card">' +
          structuredText(value) + "</div></section>";
      }

      function renderRecord(record) {
        var isApplication = record.phase === "APPLICATIONS";
        var jobHref = safeWebHref(record.canonicalUrl);
        var jobLink = jobHref
          ? '<a href="' + escapeHtml(jobHref) + '" target="_blank" rel="noreferrer">Open job posting</a>'
          : "—";
        var approval = record.review && record.review.status ? record.review.status : "PENDING";
        var approvalText = approval === "APPROVED" && record.approvedAt && record.approvedScope && record.approvalNote
          ? "Approved" + (record.approvedAt ? " at " + formatTime(record.approvedAt) : "")
          : "Not approved for submission";
        var blocker = record.blocker ? '<div class="blocker"><div class="label">Needs user</div><div class="value">' +
          escapeHtml(record.blocker.issue || record.blocker) +
          (record.blocker.completed ? "<br>Completed: " + escapeHtml(record.blocker.completed) : "") +
          (record.blocker.userStep ? "<br>Your action: " + escapeHtml(record.blocker.userStep) : "") +
          (record.blocker.resumeFrom ? "<br>Resume from: " + escapeHtml(record.blocker.resumeFrom) : "") +
          "</div></div>" : "";
        detailBody.className = "";
        detailBody.innerHTML =
          '<div class="detail-grid">' +
          addField("Status", record.status) +
          addField("Job ID", record.jobId) +
          addField("Fit score", record.fitScore == null ? "—" : record.fitScore + " / 100") +
          addField(isApplication ? "Submitted" : "Added", formatTime(isApplication ? record.submittedAt : record.addedAt)) +
          addField("Last updated", formatTime(record.lastUpdatedAt)) +
          addField("Job URL", jobLink, true) +
          addField("Waiting for your review", record.review && record.review.required && approval !== "APPROVED" ? "Yes" : "No") +
          addField("Submission approval", approvalText) +
          "</div>" +
          '<div class="next"><div class="label">Next action</div><div class="value">' + escapeHtml(record.nextAction || "—") + "</div></div>" +
          blocker +
          (record.research && record.research.summary ? '<section class="section"><h3>Research summary</h3><div class="value">' + escapeHtml(record.research.summary) + "</div></section>" : "") +
          listSection("Key company insights", record.research && record.research.companyInsights) +
          listSection("Main role requirements", record.research && record.research.roleRequirements) +
          listSection("Candidate match evidence", record.research && record.research.candidateMatches) +
          listSection("Known gaps", record.research && record.research.knownGaps) +
          infoSection("Fit assessment", record.research && record.research.fitRationale) +
          infoSection("Confirmation evidence", record.confirmation && (record.confirmation.summary || record.confirmation)) +
          documentSection("Resume", record.resume) +
          documentSection("Cover letter", record.coverLetter) +
          infoSection("Notes", record.notes);
      }

      function currentRecordPosition() {
        var rows = filteredRows();
        return {
          rows: rows,
          index: rows.findIndex(function (item) { return item.id === currentItemId; })
        };
      }

      function updateRecordNavigation() {
        var position = currentRecordPosition();
        previousRecord.disabled = position.index <= 0;
        nextRecord.disabled = position.index < 0 || position.index >= position.rows.length - 1;
      }

      function showRecord(item) {
        currentItemId = item.id;
        document.getElementById("detailCompany").textContent = item.company;
        document.getElementById("detailRole").textContent = item.role;
        document.getElementById("detailLocation").textContent = item.location || "Location unavailable";
        updateRecordNavigation();
        loadRecord(item);
      }

      function moveRecord(direction) {
        var position = currentRecordPosition();
        var item = position.rows[position.index + direction];
        if (item) showRecord(item);
      }

      function loadRecord(item) {
        window.DASHBOARD_RECORDS = window.DASHBOARD_RECORDS || {};
        detailBody.className = "loading";
        detailBody.textContent = "Loading record…";
        if (!dialog.open) dialog.showModal();
        if (window.DASHBOARD_RECORDS[item.id]) {
          renderRecord(window.DASHBOARD_RECORDS[item.id]);
          return;
        }
        if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(item.id) ||
            item.recordFile !== "./dashboard-data/records/" + item.id + ".js") {
          detailBody.textContent = "Unsafe record path rejected. Run the local validator.";
          return;
        }
        if (loadedScripts[item.recordFile]) return;
        loadedScripts[item.recordFile] = true;
        var script = document.createElement("script");
        script.src = item.recordFile;
        script.onload = function () {
          if (currentItemId !== item.id) return;
          var record = window.DASHBOARD_RECORDS[item.id];
          if (record) renderRecord(record);
          else detailBody.textContent = "Record file loaded but no matching record was found.";
        };
        script.onerror = function () {
          delete loadedScripts[item.recordFile];
          if (currentItemId !== item.id) return;
          detailBody.textContent = "Unable to load this local record.";
        };
        document.body.appendChild(script);
      }

      document.querySelectorAll(".tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          activeView = tab.dataset.view;
          page = 1;
          statusFilter.hidden = activeView !== "applications";
          document.querySelectorAll(".tab").forEach(function (button) {
            button.classList.toggle("active", button === tab);
          });
          render();
        });
      });
      search.addEventListener("input", function () { page = 1; render(); });
      statusFilter.addEventListener("change", function () { page = 1; render(); });
      sort.addEventListener("change", function () { page = 1; render(); });
      document.getElementById("previousPage").addEventListener("click", function () { page -= 1; render(); });
      document.getElementById("nextPage").addEventListener("click", function () { page += 1; render(); });
      list.addEventListener("click", function (event) {
        var row = event.target.closest(".row");
        if (!row) return;
        var item = data[activeView].find(function (candidate) { return candidate.id === row.dataset.id; });
        if (!item) return;
        showRecord(item);
      });
      previousRecord.addEventListener("click", function () { moveRecord(-1); });
      nextRecord.addEventListener("click", function () { moveRecord(1); });
      document.addEventListener("keydown", function (event) {
        if (!dialog.open || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          moveRecord(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          moveRecord(1);
        }
      });
      document.getElementById("closeDialog").addEventListener("click", function () { dialog.close(); });
      dialog.addEventListener("click", function (event) { if (event.target === dialog) dialog.close(); });
      var privacyToggle = document.getElementById("privacyModeToggle");
      privacyToggle.addEventListener("click", function () {
        privacyMode = !privacyMode;
        window.JobDashboardPrivacy.setEnabled(privacyMode);
        renderCounts();
        render();
      });
      privacyToggle.disabled = false;
      renderCounts();
      render();
    };
  </script>
  <script src="./dashboard-local/dashboard-loader.js"></script>
</body>
</html>
